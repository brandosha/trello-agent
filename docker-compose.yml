services:
  trello-agent:
    build: .
    image: trello-agent:latest
    ports:
      - "7654:7654"
    expose:
      - "7655"
    volumes:
      - trello-agent-data:/app/data
    depends_on:
      - multiagent-container
    restart: unless-stopped

  multiagent-container:
    extends:
      file: ./multiagent-container/docker-compose.yml
      service: multiagent-container
    ports: !reset []
    restart: unless-stopped

volumes:
  trello-agent-data:
  multiagent-container-data:
