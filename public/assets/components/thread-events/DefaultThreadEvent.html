<template id="default-thread-event-template">
  <div class="event" class="info">
    <div class="meta">
      <div>{{ timeLabel }}</div>
      <div>{{ eventType }}</div>
    </div>
    <div>
      <pre>{{ rawJson }}</pre>
    </div>
  </div>
</template>
<script>
  function DefaultThreadEvent(event) {
    return {
      $template: '#default-thread-event-template',
      event,
      get timeLabel() {
        const value = this.event?.timestamp;
        if (!value) return '--';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return String(value);
        return date.toLocaleTimeString();
      },
      get eventType() {
        return this.event?.type || 'event';
      },
      get itemLabel() {
        const item = this.event?.item;
        if (!item?.type) return '';
        return `${item.type}${item.status ? ` (${item.status})` : ''}`;
      },
      get rawJson() {
        return JSON.stringify(this.event, null, 2);
      },
      get isHidden() {
        return [
          'input.prompt.queued',
          'input.abort'
        ].includes(this.event?.type);
      },
    };
  }
</script>
