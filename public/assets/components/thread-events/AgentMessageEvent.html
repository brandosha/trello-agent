<template id="agent-message-event-template">
  <div class="event agent-message-event">
    <div class="meta">
      <div>{{ timeLabel }}</div>
    </div>
    <div>
      <div class="agent-message-body">{{ item.text }}</div>
    </div>
  </div>
</template>
<script>
  function AgentMessageEvent(event) {
    console.log('Creating AgentMessageEvent for event:', event);
    return {
      $template: '#agent-message-event-template',
      event,
      item: event.item,
      get timeLabel() {
        const timestamp = this.event?.timestamp;
        if (!timestamp) return '--';
        const date = new Date(timestamp);
        if (Number.isNaN(date.getTime())) return String(timestamp);
        return date.toLocaleTimeString();
      },
    };
  }
</script>
