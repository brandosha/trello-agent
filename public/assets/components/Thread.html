<template id="thread-template">
  <div class="thread" @vue:mounted="mounted">
    <header>
      <div class="title">
        Remote Agent
        <small>Thread: {{ threadLabel }}</small>
      </div>
    </header>
    <div class="layout">
      <section class="panel">
        <div class="panel-header">
          <div class="badge" :style="{ color: connectionColor }">{{ connectionStatus }}</div>
          <div class="filters">
            <input v-model="filterText" type="text" placeholder="Filter text" @input="applyFilters" />
            <select v-model="filterType" @change="applyFilters">
              <option value="">All types</option>
              <option v-for="type in typeOptions" :key="type" :value="type">{{ type }}</option>
            </select>
            <label class="badge">
              <input v-model="autoscroll" type="checkbox" />
              Auto-scroll
            </label>
          </div>
        </div>
        <div class="panel-body">
          <div v-if="!authorized" class="badge">Trello authorization required to view this thread.</div>
          <div v-else-if="!canView" class="badge">You do not have permission to view this thread.</div>
          <div v-else class="events" ref="eventsContainer" @scroll="handleScroll">
            <div v-for="event in filteredEvents" :key="event.id" v-scope="ThreadEvent(event)"></div>
          </div>
        </div>
      </section>
      <aside class="stack">
        <section class="panel">
          <div class="panel-header">
            <div>Session</div>
          </div>
          <div class="panel-body stat-grid">
            <div class="stat">
              <div class="label">Total events</div>
              <div class="value">{{ totalEvents }}</div>
            </div>
            <div class="stat">
              <div class="label">Last event</div>
              <div class="value">{{ lastEventTime }}</div>
            </div>
            <div class="stat">
              <div class="label">Inputs sent</div>
              <div class="value">{{ inputCount }}</div>
            </div>
            <div class="stat">
              <div class="label">Errors</div>
              <div class="value">{{ errorCount }}</div>
            </div>
          </div>
        </section>
        <section class="panel" v-if="authorized && canView">
          <div class="panel-header">Controls</div>
          <div class="panel-body">
            <form class="input-row" @submit.prevent="sendPrompt">
              <div
                ref="promptComposer"
                class="prompt-composer"
                :class="{ disabled: !canPrompt }"
                :contenteditable="canPrompt ? 'true' : 'false'"
                :aria-disabled="!canPrompt"
                role="textbox"
                aria-multiline="true"
                data-placeholder="Send input to agent"
                @input="handlePromptInput"
                @keydown="handlePromptKeydown"
                @paste="handlePromptPaste"
              ></div>
              <button type="submit" class="btn primary" :disabled="!canPrompt">Send</button>
              <button type="button" class="btn danger" :disabled="!canAbort" @click="sendAbort">Abort</button>
            </form>
          </div>
        </section>
      </aside>
    </div>
  </div>
</template>
<script>
  function Thread(threadId) {
    return PetiteVue.reactive({
      $template: '#thread-template',
      backend: null,
      threadId,
      threadLabel: '(loading...)',
      connectionStatus: 'Connecting...',
      connectionColor: 'var(--muted)',
      filterText: '',
      filterType: '',
      autoscroll: true,
      typeOptions: [],
      events: [],
      eventIds: Object.create(null),
      filteredEvents: [],
      inputCount: 0,
      errorCount: 0,
      promptInput: '',
      historicalLimit: 50,
      historicalLoaded: 0,
      hasOlderEvents: true,
      loadingOlderEvents: false,
      initialHistoryLoaded: false,
      subscribed: false,
      connected: false,
      authorized: false,
      canView: false,
      canPrompt: false,
      canAbort: false,
      totalEvents: 0,
      lastEventTime: '--',
      mounted() {
        this.threadLabel = this.threadId || '(none)';
        this.backend = app.backend;
        if (!this.backend) return;

        this.backend.listen('error', () => this.setConnection('Error', 'var(--err)'));
        this.backend.listen('auth.permissions', () => this.handleAuthUpdate());
        this.backend.listen('auth.success', () => this.handleAuthUpdate());

        this.syncAuthState();
        this.applyFilters();
        this.syncEventStats();
        this.subscribeToThread();
      },
      setConnection(status, color) {
        this.connectionStatus = status;
        this.connectionColor = color;
      },
      syncAuthState() {
        const auth = this.backend?.auth;
        this.authorized = !!auth?.email;
        this.canView = auth?.hasPermission ? auth.hasPermission('thread.view') : false;
        this.canPrompt = auth?.hasPermission ? auth.hasPermission('thread.prompt') : false;
        this.canAbort = auth?.hasPermission ? auth.hasPermission('thread.abort') : false;
      },
      syncEventStats() {
        this.totalEvents = this.events.length;
        if (!this.events.length) {
          this.lastEventTime = '--';
          return;
        }
        this.lastEventTime = this.events[this.events.length - 1].timeLabel || '--';
      },
      applyFilters() {
        const text = this.filterText.trim().toLowerCase();
        const type = this.filterType;
        this.filteredEvents = this.events.filter((event) => {
          const matchesText = !text || event.searchText.includes(text);
          const matchesType = !type || event.type === type;
          return matchesText && matchesType;
        });
      },
      getPromptText() {
        const composer = this.$refs.promptComposer;
        const value = composer ? composer.innerText : this.promptInput;
        return value.replace(/\u00a0/g, ' ').replace(/\r\n/g, '\n');
      },
      setPromptText(value) {
        this.promptInput = value;
        const composer = this.$refs.promptComposer;
        if (composer && composer.innerText !== value) {
          composer.innerText = value;
        }
      },
      handlePromptInput() {
        this.promptInput = this.getPromptText();
      },
      handlePromptKeydown(event) {
        if (event.key !== 'Enter' || !event.shiftKey) return;
        event.preventDefault();
        this.sendPrompt();
      },
      handlePromptPaste(event) {
        event.preventDefault();
        const text = event.clipboardData?.getData('text/plain') || '';
        document.execCommand('insertText', false, text);
        this.handlePromptInput();
      },
      sendPrompt() {
        const input = this.getPromptText();
        if (!input.trim() || !this.backend || !this.canPrompt) return;
        this.backend.send('thread.prompt', { threadId: this.threadId, prompt: input });
        this.setPromptText('');
      },
      sendAbort() {
        if (!this.backend || !this.canAbort) return;
        this.backend.send('thread.abort', { threadId: this.threadId });
      },
      handleAuthUpdate() {
        this.syncAuthState();
        this.subscribeToThread();
      },
      subscribeToThread() {
        if (this.subscribed || !this.backend || !this.authorized || !this.canView) return;
        this.subscribed = true;
        this.backend.subscribeThread(
          this.threadId,
          (event) => this.handleLiveEvent(event),
          (page) => this.handleHistoryPage(page)
        );
      },
      handleScroll() {
        const container = this.$refs.eventsContainer;
        if (!container || container.scrollTop > 80) return;
        this.loadOlderEvents();
      },
      loadOlderEvents() {
        if (!this.backend || !this.initialHistoryLoaded || this.loadingOlderEvents || !this.hasOlderEvents) {
          return;
        }

        this.loadingOlderEvents = true;
        this.backend.requestThreadEvents(this.threadId, {
          limit: this.historicalLimit,
          offset: this.historicalLoaded,
        });
      },
      handleLiveEvent(event) {
        if (!this.connected) {
          this.connected = true;
          this.setConnection('Connected', 'var(--ok)');
        }
        this.mergeEvents([event], 'append');

        this.syncEventStats();
        this.applyFilters();

        if (this.autoscroll) {
          setTimeout(() => {
            const container = this.$refs.eventsContainer;
            const last = container?.lastElementChild;
            if (last) last.scrollIntoView({ behavior: 'smooth', block: 'end' });
          }, 0);
        }
      },
      handleHistoryPage(page) {
        if (!this.connected) {
          this.connected = true;
          this.setConnection('Connected', 'var(--ok)');
        }

        const position = page.offset > 0 ? 'prepend' : 'append';
        this.mergeEvents(page.events || [], position);
        const nextOffset = page.nextOffset ?? (page.offset || 0) + (page.events?.length || 0);
        this.historicalLoaded = Math.max(this.historicalLoaded, nextOffset);
        this.hasOlderEvents = !!page.hasMore;
        this.loadingOlderEvents = false;
        this.initialHistoryLoaded = true;

        this.syncEventStats();
        this.applyFilters();

        if (position === 'append' && this.autoscroll) {
          setTimeout(() => {
            const container = this.$refs.eventsContainer;
            if (container) container.scrollTop = container.scrollHeight;
          }, 0);
        }
      },
      mergeEvents(rawEvents, position) {
        if (!Array.isArray(rawEvents) || !rawEvents.length) return 0;

        const normalized = [];
        for (const rawEvent of rawEvents) {
          const event = this.normalizeEvent(rawEvent);
          if (this.eventIds[event.id]) continue;
          this.eventIds[event.id] = true;
          normalized.push(event);

          if (event.type) this.addTypeOption(event.type);
          if (event.type === 'input.prompt') this.inputCount += 1;
          if (event.tone === 'err') this.errorCount += 1;
        }

        if (!normalized.length) return 0;

        if (position === 'prepend') {
          const container = this.$refs.eventsContainer;
          const previousHeight = container?.scrollHeight ?? 0;
          const previousTop = container?.scrollTop ?? 0;

          this.events.unshift(...normalized);

          setTimeout(() => {
            if (!container) return;
            container.scrollTop = previousTop + (container.scrollHeight - previousHeight);
          }, 0);
        } else {
          this.events.push(...normalized);
        }

        return normalized.length;
      },
      normalizeEvent(message) {
        const payload = this.getEventPayload(message);
        const type = payload?.type || message?.type || 'event';
        const tone = this.classifyEvent(message);
        const summary = this.extractSummary(message);
        const timeLabel = this.formatTimestamp(payload?.timestamp || message?.timestamp);
        const id = payload?.id || message?.id || this.generateLocalId();
        const threadLabel = message?.threadId || message?.thread_id || payload?.threadId || payload?.thread_id || '--';
        const item = payload?.item || null;
        const itemLabel = payload?.item?.type
          ? `${payload.item.type}${payload.item.status ? ` (${payload.item.status})` : ''}`
          : '';
        const searchText = JSON.stringify(payload || message).toLowerCase();

        return {
          id,
          type,
          tone,
          summary,
          timeLabel,
          threadLabel,
          payload,
          raw: message,
          item,
          itemLabel,
          searchText,
        };
      },
      addTypeOption(type) {
        if (this.typeOptions.includes(type)) return;
        this.typeOptions = [...this.typeOptions, type].sort();
      },
      getEventPayload(message) {
        if (message && message.type === 'thread.event' && message.event) {
          return message.event;
        }
        return message;
      },
      classifyEvent(message) {
        const payload = this.getEventPayload(message);
        const type = payload?.type || message?.type || 'event';
        const itemStatus = payload?.item?.status;
        if (itemStatus === 'failed') return 'err';
        if (type.includes('error') || type.includes('failed') || type.includes('invalid')) return 'err';
        if (type.includes('warn') || type.includes('abort')) return 'warn';
        if (itemStatus === 'completed' || type.includes('completed') || type.includes('started')) return 'ok';
        return 'info';
      },
      extractSummary(message) {
        const payload = this.getEventPayload(message);
        if (payload?.type === 'input.prompt' || payload?.type === 'input.prompt.queued') {
          const prompt = typeof payload.prompt === 'string' ? payload.prompt : JSON.stringify(payload.prompt);
          return `Prompt: ${prompt}`;
        }
        if (payload?.type === 'input.abort') {
          return `Abort requested by ${payload.from || 'unknown'}`;
        }
        if (payload?.type === 'turn.abort') {
          return 'Turn aborted';
        }
        if (payload?.type === 'turn.error') {
          const name = payload.error?.name || 'Error';
          const messageText = payload.error?.message || 'Unknown error';
          return `${name}: ${messageText}`;
        }
        if (payload?.type === 'thread.started') {
          return `Thread started: ${payload.thread_id || payload.threadId || 'unknown'}`;
        }
        if (payload?.type === 'turn.started') {
          return 'Turn started';
        }
        if (payload?.type === 'turn.completed' && payload?.usage) {
          const usage = payload.usage;
          return `Turn completed (in ${usage.input_tokens}, out ${usage.output_tokens})`;
        }
        if (payload?.item?.text) return payload.item.text;
        if (payload?.item?.type === 'command_execution') {
          const status = payload.item.status || 'unknown';
          return `${status}: ${payload.item.command}`;
        }
        if (payload?.item?.type) {
          const status = payload.item.status ? ` (${payload.item.status})` : '';
          return `${payload.item.type}${status}`;
        }
        if (payload?.message) return payload.message;
        if (payload?.input) return payload.input;
        if (typeof payload?.type === 'string') return payload.type;
        if (typeof message?.type === 'string') return message.type;
        return 'Event received';
      },
      formatTimestamp(value) {
        if (!value) return '--';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return String(value);
        return date.toLocaleTimeString();
      },
      generateLocalId() {
        return Math.random().toString(36).slice(2, 8);
      },
    });
  }
</script>
