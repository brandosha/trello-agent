<template id="thread-template">
  <div class="thread" @vue:mounted="mounted">
    <header>
      <div class="title">
        Remote Agent
        <small>Thread: {{ threadLabel }}</small>
      </div>
    </header>
    <div class="layout">
      <section class="panel">
        <div class="panel-header">
          <div class="badge" :style="{ color: connectionColor }">{{ connectionStatus }}</div>
          <div class="filters">
            <input v-model="filterText" type="text" placeholder="Filter text" />
            <select v-model="filterType">
              <option value="">All types</option>
              <option v-for="type in typeOptions" :key="type" :value="type">{{ type }}</option>
            </select>
            <label class="badge">
              <input v-model="autoscroll" type="checkbox" />
              Auto-scroll
            </label>
          </div>
        </div>
        <div class="panel-body">
          <div v-if="!authorized" class="badge">Trello authorization required to view this thread.</div>
          <div v-else-if="!canView" class="badge">You do not have permission to view this thread.</div>
          <div v-else class="events" ref="eventsContainer">
            <div v-for="event in filteredEvents" :key="event.id" class="event" :class="event.tone">
              <div class="meta">
                <div>Time: {{ event.timeLabel }}</div>
                <div>ID: {{ event.id }}</div>
                <div>Thread: {{ event.threadLabel }}</div>
                <div v-if="event.itemLabel">Item: {{ event.itemLabel }}</div>
              </div>
              <div>
                <div class="type">{{ event.type }}</div>
                <div class="event-summary">{{ event.summary }}</div>
              </div>
            </div>
          </div>
        </div>
      </section>
      <aside class="stack">
        <section class="panel">
          <div class="panel-header">
            <div>Session</div>
          </div>
          <div class="panel-body stat-grid">
            <div class="stat">
              <div class="label">Total events</div>
              <div class="value">{{ totalEvents }}</div>
            </div>
            <div class="stat">
              <div class="label">Last event</div>
              <div class="value">{{ lastEventTime }}</div>
            </div>
            <div class="stat">
              <div class="label">Inputs sent</div>
              <div class="value">{{ inputCount }}</div>
            </div>
            <div class="stat">
              <div class="label">Errors</div>
              <div class="value">{{ errorCount }}</div>
            </div>
          </div>
        </section>
        <section class="panel" v-if="authorized && canView">
          <div class="panel-header">Controls</div>
          <div class="panel-body">
            <form class="input-row" @submit.prevent="sendPrompt">
              <input v-model="promptInput" type="text" placeholder="Send input to agent" :disabled="!canPrompt" />
              <button type="submit" class="btn primary" :disabled="!canPrompt">Send</button>
              <button type="button" class="btn danger" :disabled="!canAbort" @click="sendAbort">Abort</button>
            </form>
          </div>
        </section>
      </aside>
    </div>
  </div>
</template>
<script>
  function Thread(threadId) {
    return {
      $template: '#thread-template',
      api: null,
      threadId,
      threadLabel: '(loading...)',
      connectionStatus: 'Connecting...',
      connectionColor: 'var(--muted)',
      filterText: '',
      filterType: '',
      autoscroll: true,
      typeOptions: [],
      events: [],
      inputCount: 0,
      errorCount: 0,
      promptInput: '',
      subscribed: false,
      mounted() {
        this.threadLabel = this.threadId || '(none)';
        this.api = app.api;
        if (!this.api) return;

        this.api.onOpen(() => this.setConnection('Connected', 'var(--ok)'));
        this.api.onClose(() => this.setConnection('Disconnected', 'var(--warn)'));
        this.api.onError(() => this.setConnection('Error', 'var(--err)'));

        this.api.onMessage((message) => this.handleMessage(message));

        this.subscribeToThread();
      },
      get authorized() {
        return app.user.authorized;
      },
      get canView() {
        return app.hasPermission ? app.hasPermission('thread.view') : false;
      },
      get canPrompt() {
        return app.hasPermission ? app.hasPermission('thread.prompt') : false;
      },
      get canAbort() {
        return app.hasPermission ? app.hasPermission('thread.abort') : false;
      },
      setConnection(status, color) {
        this.connectionStatus = status;
        this.connectionColor = color;
      },
      get totalEvents() {
        return this.events.length;
      },
      get lastEventTime() {
        if (!this.events.length) return '--';
        return this.events[this.events.length - 1].timeLabel || '--';
      },
      get filteredEvents() {
        const text = this.filterText.trim().toLowerCase();
        const type = this.filterType;
        return this.events.filter((event) => {
          const matchesText = !text || event.searchText.includes(text);
          const matchesType = !type || event.type === type;
          return matchesText && matchesType;
        });
      },
      sendPrompt() {
        const input = this.promptInput.trim();
        if (!input || !this.api || !this.canPrompt) return;
        this.api.sendPrompt(this.threadId, input);
        this.promptInput = '';
      },
      sendAbort() {
        if (!this.api || !this.canAbort) return;
        this.api.abort(this.threadId);
      },
      handleMessage(message) {
        console.log('Received message in thread:', message);
        if (message?.type === 'auth.permissions' || message?.type === 'auth.success') {
          this.subscribeToThread();
        }
      },
      subscribeToThread() {
        if (this.subscribed || !this.api || !this.authorized || !this.canView) return;
        this.subscribed = true;
        this.api.subscribe(this.threadId, (message) => {
          this.handleEvent(message);
        });
      },
      handleEvent(message) {
        const payload = this.getEventPayload(message);
        const type = payload?.type || message?.type || 'event';
        const tone = this.classifyEvent(message);
        const summary = this.extractSummary(message);
        const timeLabel = this.formatTimestamp(payload?.timestamp || message?.timestamp);
        const id = payload?.id || message?.id || this.generateLocalId();
        const threadLabel = message?.threadId || message?.thread_id || payload?.threadId || payload?.thread_id || '--';
        const itemLabel = payload?.item?.type
          ? `${payload.item.type}${payload.item.status ? ` (${payload.item.status})` : ''}`
          : '';
        const searchText = JSON.stringify(payload || message).toLowerCase();

        this.events.push({
          id,
          type,
          tone,
          summary,
          timeLabel,
          threadLabel,
          itemLabel,
          searchText,
        });

        if (payload?.type) this.addTypeOption(payload.type);
        if (payload?.type === 'input.prompt') this.inputCount += 1;
        if (tone === 'err') this.errorCount += 1;

        if (this.autoscroll) {
          setTimeout(() => {
            const container = this.$refs.eventsContainer;
            const last = container?.lastElementChild;
            if (last) last.scrollIntoView({ behavior: 'smooth', block: 'end' });
          }, 0);
        }
      },
      addTypeOption(type) {
        if (this.typeOptions.includes(type)) return;
        this.typeOptions = [...this.typeOptions, type].sort();
      },
      getEventPayload(message) {
        if (message && message.type === 'thread.event' && message.event) {
          return message.event;
        }
        return message;
      },
      classifyEvent(message) {
        const payload = this.getEventPayload(message);
        const type = payload?.type || message?.type || 'event';
        const itemStatus = payload?.item?.status;
        if (itemStatus === 'failed') return 'err';
        if (type.includes('error') || type.includes('failed') || type.includes('invalid')) return 'err';
        if (type.includes('warn') || type.includes('abort')) return 'warn';
        if (itemStatus === 'completed' || type.includes('completed') || type.includes('started')) return 'ok';
        return 'info';
      },
      extractSummary(message) {
        const payload = this.getEventPayload(message);
        if (payload?.type === 'input.prompt' || payload?.type === 'input.prompt.queued') {
          const prompt = typeof payload.prompt === 'string' ? payload.prompt : JSON.stringify(payload.prompt);
          return `Prompt: ${prompt}`;
        }
        if (payload?.type === 'input.abort') {
          return `Abort requested by ${payload.from || 'unknown'}`;
        }
        if (payload?.type === 'turn.abort') {
          return 'Turn aborted';
        }
        if (payload?.type === 'turn.error') {
          const name = payload.error?.name || 'Error';
          const messageText = payload.error?.message || 'Unknown error';
          return `${name}: ${messageText}`;
        }
        if (payload?.type === 'thread.started') {
          return `Thread started: ${payload.thread_id || payload.threadId || 'unknown'}`;
        }
        if (payload?.type === 'turn.started') {
          return 'Turn started';
        }
        if (payload?.type === 'turn.completed' && payload?.usage) {
          const usage = payload.usage;
          return `Turn completed (in ${usage.input_tokens}, out ${usage.output_tokens})`;
        }
        if (payload?.item?.text) return payload.item.text;
        if (payload?.item?.type === 'command_execution') {
          const status = payload.item.status || 'unknown';
          return `${status}: ${payload.item.command}`;
        }
        if (payload?.item?.type) {
          const status = payload.item.status ? ` (${payload.item.status})` : '';
          return `${payload.item.type}${status}`;
        }
        if (payload?.message) return payload.message;
        if (payload?.input) return payload.input;
        if (typeof payload?.type === 'string') return payload.type;
        if (typeof message?.type === 'string') return message.type;
        return 'Event received';
      },
      formatTimestamp(value) {
        if (!value) return '--';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return String(value);
        return date.toLocaleTimeString();
      },
      generateLocalId() {
        return Math.random().toString(36).slice(2, 8);
      },
    };
  }
</script>
