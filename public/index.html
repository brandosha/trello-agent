<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remote Agent</title>
  <link href="/assets/style.css" rel="stylesheet" />
</head>
<body>
  <header>
    <div class="title">
      Remote Agent
      <small id="thread-id">Thread: (loading...)</small>
    </div>
  </header>
  <div class="layout">
    <section class="panel">
      <div class="panel-header">
        <div class="badge" id="connection-status">Connecting...</div>
        <div class="filters">
          <input id="filter-text" type="text" placeholder="Filter text" />
          <select id="filter-type">
            <option value="">All types</option>
          </select>
          <label class="badge">
            <input id="autoscroll" type="checkbox" checked />
            Auto-scroll
          </label>
        </div>
      </div>
      <div class="panel-body">
        <div id="thread-events" class="events"></div>
      </div>
    </section>
    <aside class="stack">
      <section class="panel">
        <div class="panel-header">
          <div>Session</div>
        </div>
        <div class="panel-body stat-grid">
          <div class="stat">
            <div class="label">Total events</div>
            <div class="value" id="stat-total">0</div>
          </div>
          <div class="stat">
            <div class="label">Last event</div>
            <div class="value" id="stat-last">--</div>
          </div>
          <div class="stat">
            <div class="label">Inputs sent</div>
            <div class="value" id="stat-inputs">0</div>
          </div>
          <div class="stat">
            <div class="label">Errors</div>
            <div class="value" id="stat-errors">0</div>
          </div>
        </div>
      </section>
      <section class="panel">
        <div class="panel-header">Controls</div>
        <div class="panel-body">
          <form id="input-form" class="input-row">
            <input type="text" id="input-field" placeholder="Send input to agent" />
            <button type="submit" class="btn primary">Send</button>
            <button type="button" id="abort-button" class="btn danger">Abort</button>
          </form>
        </div>
      </section>
    </aside>
  </div>
  <script src="/assets/index.js"></script>
</body>
</html>
